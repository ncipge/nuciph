<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homologação - Gerenciador de Dados</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #1e293b;
      padding: 1.5rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e293b;
    }

    .env-badge {
      display: inline-block;
      background: #fbbf24;
      color: #78350f;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .user-info {
      font-size: 0.875rem;
      color: #64748b;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 1rem;
    }

    .search-box {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .search-box:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .btn-success:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    thead {
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
    }

    th {
      padding: 1rem 0.75rem;
      text-align: left;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    td {
      padding: 1rem 0.75rem;
      font-size: 0.9rem;
      color: #475569;
      border-bottom: 1px solid #f1f5f9;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-conforme {
      background: #dcfce7;
      color: #166534;
    }

    .status-parcial {
      background: #fef3c7;
      color: #92400e;
    }

    .status-inconforme {
      background: #fee2e2;
      color: #991b1b;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-info {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
    }

    .spinner {
      border: 3px solid #f1f5f9;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .message-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .message-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .hidden {
      display: none;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #e2e8f0;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #64748b;
      cursor: pointer;
      padding: 0.5rem;
      line-height: 1;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #1e293b;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.5rem;
    }

    .form-input,
    .form-select,
    .form-textarea {
      padding: 0.75rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group-full {
      grid-column: 1 / -1;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      padding-top: 1rem;
      border-top: 2px solid #e2e8f0;
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-title {
        font-size: 1.5rem;
      }

      .btn-group {
        width: 100%;
      }

      .btn {
        flex: 1;
        justify-content: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .modal-content {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="addModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Adicionar Novo Registro</h3>
        <button class="close-btn" onclick="closeAddModal()">&times;</button>
      </div>

      <form id="addForm">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Sistema *</label>
            <select id="sistema" class="form-select" required>
              <option value="">Selecione</option>
              <option value="PAE 3.0">PAE 3.0</option>
              <option value="PAE 4.0">PAE 4.0</option>
              <option value="SAJ/ATTUS">SAJ/ATTUS</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Núm. PAE/SAJ *</label>
            <input type="text" id="numPaejSaj" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label">Interessado *</label>
            <input type="text" id="interessado" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label">Entrada *</label>
            <input type="date" id="entrada" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label">Situação *</label>
            <select id="situacao" class="form-select" required>
              <option value="">Selecione</option>
              <option value="Conforme">Conforme</option>
              <option value="Parcialmente Conforme">Parcialmente Conforme</option>
              <option value="Assimetrias">Assimetrias</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Assimetria</label>
            <select id="assimetria" class="form-select">
              <option value="">Selecione</option>
              <option value="DESACORDO LEGAL">DESACORDO LEGAL</option>
              <option value="FALTA DE DOCUMENTO">FALTA DE DOCUMENTO</option>
              <option value="PRAZO">PRAZO</option>
              <option value="ESCLARECIMENTO">ESCLARECIMENTO</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">UG Origem</label>
            <input type="text" id="ugOrigem" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Assunto</label>
            <select id="assunto" class="form-select">
              <option value="">Selecione</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Sub Assunto</label>
            <select id="subAssunto" class="form-select" disabled>
              <option value="">Selecione</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">ACI Responsável</label>
            <input type="text" id="aciResponsavel" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Destino</label>
            <input type="text" id="destino" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Saída</label>
            <input type="date" id="saida" class="form-input">
          </div>

          <div class="form-group form-group-full">
            <label class="form-label">Observação</label>
            <textarea id="observacao" class="form-textarea"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancelar</button>
          <button type="submit" class="btn btn-success" id="submitBtn">Salvar Registro</button>
        </div>
      </form>

      <div id="modalMessage" class="hidden"></div>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <div class="header-content">
        <div>
          <h1 class="header-title">Gerenciador de Dados</h1>
          <span class="env-badge">Ambiente de Homologação</span>
        </div>
        <div class="user-info">
          <span id="userEmail">Carregando...</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Buscar Registros</h2>
      <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Digite para buscar em todos os campos..."
      >
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
        <h2 class="card-title" style="margin-bottom: 0;">Registros</h2>
        <div class="btn-group">
          <button id="refreshBtn" class="btn btn-secondary">Atualizar</button>
          <button id="addBtn" class="btn btn-success">+ Novo Registro</button>
        </div>
      </div>

      <div id="messageBox" class="hidden"></div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Sistema</th>
              <th>Núm. PAE/SAJ</th>
              <th>Interessado</th>
              <th>Entrada</th>
              <th>Situação</th>
              <th>Assimetria</th>
              <th>UG Origem</th>
              <th>Assunto</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="9">
                <div class="loading">
                  <div class="spinner"></div>
                  <p>Carregando dados...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="prevBtn" class="btn btn-secondary" disabled>Anterior</button>
        <span class="page-info" id="pageInfo">Página 1 de 1</span>
        <button id="nextBtn" class="btn btn-secondary" disabled>Próximo</button>
      </div>
    </div>
  </div>

  <script>
    let currentPage = 1;
    const pageSize = 20;
    let totalRecords = 0;
    let totalPages = 1;
    let allData = [];
    let filteredData = [];

    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('tableBody');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const addBtn = document.getElementById('addBtn');
    const messageBox = document.getElementById('messageBox');
    const userEmail = document.getElementById('userEmail');
    const addModal = document.getElementById('addModal');
    const addForm = document.getElementById('addForm');
    const modalMessage = document.getElementById('modalMessage');

    let assuntoSubAssuntoMap = {};

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = `message message-${type}`;
      messageBox.classList.remove('hidden');
      setTimeout(() => {
        messageBox.classList.add('hidden');
      }, 5000);
    }

    function showModalMessage(message, type) {
      modalMessage.textContent = message;
      modalMessage.className = `message message-${type}`;
      modalMessage.classList.remove('hidden');
      setTimeout(() => {
        modalMessage.classList.add('hidden');
      }, 5000);
    }

    function loadUserEmail() {
      google.script.run
        .withSuccessHandler(function(email) {
          userEmail.textContent = email;
        })
        .withFailureHandler(function() {
          userEmail.textContent = 'Não disponível';
        })
        .getUserEmail();
    }

    function loadAssuntoSubAssuntoMap() {
      google.script.run
        .withSuccessHandler(function(map) {
          assuntoSubAssuntoMap = map;
          populateAssuntoDropdown();
        })
        .withFailureHandler(function(error) {
          console.error('Erro ao carregar assuntos:', error);
        })
        .getAssuntoSubAssuntoMap();
    }

    function populateAssuntoDropdown() {
      const assuntoSelect = document.getElementById('assunto');
      assuntoSelect.innerHTML = '<option value="">Selecione</option>';

      Object.keys(assuntoSubAssuntoMap).sort().forEach(assunto => {
        const option = document.createElement('option');
        option.value = assunto;
        option.textContent = assunto;
        assuntoSelect.appendChild(option);
      });
    }

    function updateSubAssuntoDropdown() {
      const assuntoSelect = document.getElementById('assunto');
      const subAssuntoSelect = document.getElementById('subAssunto');
      const selectedAssunto = assuntoSelect.value;

      subAssuntoSelect.innerHTML = '<option value="">Selecione</option>';

      if (selectedAssunto && assuntoSubAssuntoMap[selectedAssunto]) {
        const subAssuntos = assuntoSubAssuntoMap[selectedAssunto];
        subAssuntos.sort().forEach(subAssunto => {
          const option = document.createElement('option');
          option.value = subAssunto;
          option.textContent = subAssunto;
          subAssuntoSelect.appendChild(option);
        });
        subAssuntoSelect.disabled = false;
      } else {
        subAssuntoSelect.disabled = true;
      }
    }

    function openAddModal() {
      addModal.classList.remove('hidden');
      addForm.reset();
      document.getElementById('entrada').valueAsDate = new Date();
      modalMessage.classList.add('hidden');
    }

    function closeAddModal() {
      addModal.classList.add('hidden');
      addForm.reset();
    }

    function loadData() {
      tableBody.innerHTML = '<tr><td colspan="9"><div class="loading"><div class="spinner"></div><p>Carregando dados...</p></div></td></tr>';

      google.script.run
        .withSuccessHandler(function(response) {
          allData = response.data;
          totalRecords = response.totalRecords;
          applySearch();
        })
        .withFailureHandler(function(error) {
          showMessage('Erro ao carregar dados: ' + error, 'error');
          tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 2rem; color: #ef4444;">Erro ao carregar dados</td></tr>';
        })
        .lerTodosOsDadosWeb(1, 10000, {});
    }

    function applySearch() {
      const query = searchInput.value.toLowerCase().trim();

      if (!query) {
        filteredData = allData;
      } else {
        filteredData = allData.filter(row => {
          return row.some(cell =>
            cell && cell.toString().toLowerCase().includes(query)
          );
        });
      }

      totalRecords = filteredData.length;
      totalPages = Math.ceil(totalRecords / pageSize) || 1;
      currentPage = 1;
      renderTable();
      updatePagination();
    }

    function renderTable() {
      if (filteredData.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 2rem; color: #94a3b8;">Nenhum registro encontrado</td></tr>';
        return;
      }

      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filteredData.slice(start, end);

      tableBody.innerHTML = '';
      pageData.forEach((row, index) => {
        const actualIndex = start + index + 2;
        const tr = document.createElement('tr');

        const sistema = row[0] || '';
        const numPaej = row[1] || '';
        const interessado = row[2] || '';
        const entrada = row[3] || '';
        const situacao = row[4] || '';
        const assimetria = row[5] || '';
        const ugOrigem = row[7] || '';
        const assunto = row[8] || '';

        let statusClass = 'status-inconforme';
        if (situacao.toLowerCase().includes('conforme') && !situacao.toLowerCase().includes('parcial')) {
          statusClass = 'status-conforme';
        } else if (situacao.toLowerCase().includes('parcial')) {
          statusClass = 'status-parcial';
        }

        tr.innerHTML = `
          <td>${sistema}</td>
          <td>${numPaej}</td>
          <td>${interessado}</td>
          <td>${entrada}</td>
          <td><span class="status-badge ${statusClass}">${situacao}</span></td>
          <td>${assimetria}</td>
          <td>${ugOrigem}</td>
          <td>${assunto}</td>
          <td>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-secondary" style="padding: 0.5rem 0.75rem; font-size: 0.85rem;" onclick="editRecord(${actualIndex}, ${index})">Editar</button>
              <button class="btn btn-danger" style="padding: 0.5rem 0.75rem; font-size: 0.85rem;" onclick="deleteRecord(${actualIndex})">Excluir</button>
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function updatePagination() {
      pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages || totalRecords === 0;
    }

    function editRecord(rowIndex, dataIndex) {
      showMessage('Funcionalidade de edição em desenvolvimento', 'error');
    }

    function deleteRecord(rowIndex) {
      if (!confirm('Tem certeza que deseja excluir este registro?')) {
        return;
      }

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.sucesso) {
            showMessage(response.mensagem, 'success');
            loadData();
          } else {
            showMessage(response.mensagem, 'error');
          }
        })
        .withFailureHandler(function(error) {
          showMessage('Erro ao excluir registro: ' + error, 'error');
        })
        .deletarRegistroWeb(rowIndex);
    }

    searchInput.addEventListener('input', applySearch);

    prevBtn.addEventListener('click', function() {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
        updatePagination();
      }
    });

    nextBtn.addEventListener('click', function() {
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
        updatePagination();
      }
    });

    refreshBtn.addEventListener('click', loadData);

    addBtn.addEventListener('click', openAddModal);

    document.getElementById('assunto').addEventListener('change', updateSubAssuntoDropdown);

    addForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Salvando...';

      const formData = {
        sistema: document.getElementById('sistema').value,
        numPaejSaj: document.getElementById('numPaejSaj').value,
        interessado: document.getElementById('interessado').value,
        entrada: document.getElementById('entrada').value,
        situacao: document.getElementById('situacao').value,
        assimetria: document.getElementById('assimetria').value,
        observacao: document.getElementById('observacao').value,
        ugOrigem: document.getElementById('ugOrigem').value,
        assunto: document.getElementById('assunto').value,
        subAssunto: document.getElementById('subAssunto').value,
        aciResponsavel: document.getElementById('aciResponsavel').value,
        destino: document.getElementById('destino').value,
        saida: document.getElementById('saida').value
      };

      google.script.run
        .withSuccessHandler(function(response) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Salvar Registro';

          if (response.sucesso) {
            showModalMessage(response.mensagem, 'success');
            setTimeout(() => {
              closeAddModal();
              loadData();
            }, 1500);
          } else {
            showModalMessage(response.mensagem, 'error');
          }
        })
        .withFailureHandler(function(error) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Salvar Registro';
          showModalMessage('Erro ao salvar: ' + error, 'error');
        })
        .gravarDadosWeb(formData);
    });

    addModal.addEventListener('click', function(e) {
      if (e.target === addModal) {
        closeAddModal();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      loadUserEmail();
      loadAssuntoSubAssuntoMap();
      loadData();
    });
  </script>
</body>
</html>
