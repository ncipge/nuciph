<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homologação - Gerenciador de Dados</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #1e293b;
      padding: 1.5rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e293b;
    }

    .env-badge {
      display: inline-block;
      background: #fbbf24;
      color: #78350f;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .user-info {
      font-size: 0.875rem;
      color: #64748b;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 1rem;
    }

    .search-box {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .search-box:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .btn-success:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    thead {
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
    }

    th {
      padding: 1rem 0.75rem;
      text-align: left;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    td {
      padding: 1rem 0.75rem;
      font-size: 0.9rem;
      color: #475569;
      border-bottom: 1px solid #f1f5f9;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-conforme {
      background: #dcfce7;
      color: #166534;
    }

    .status-parcial {
      background: #fef3c7;
      color: #92400e;
    }

    .status-inconforme {
      background: #fee2e2;
      color: #991b1b;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-info {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
    }

    .spinner {
      border: 3px solid #f1f5f9;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .message-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .message-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-title {
        font-size: 1.5rem;
      }

      .btn-group {
        width: 100%;
      }

      .btn {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <div>
          <h1 class="header-title">Gerenciador de Dados</h1>
          <span class="env-badge">Ambiente de Homologação</span>
        </div>
        <div class="user-info">
          <span id="userEmail">Carregando...</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Buscar Registros</h2>
      <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Digite para buscar em todos os campos..."
      >
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
        <h2 class="card-title" style="margin-bottom: 0;">Registros</h2>
        <div class="btn-group">
          <button id="refreshBtn" class="btn btn-secondary">Atualizar</button>
          <button id="addBtn" class="btn btn-success">+ Novo Registro</button>
        </div>
      </div>

      <div id="messageBox" class="hidden"></div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Sistema</th>
              <th>Núm. PAE/SAJ</th>
              <th>Interessado</th>
              <th>Entrada</th>
              <th>Situação</th>
              <th>Assimetria</th>
              <th>UG Origem</th>
              <th>Assunto</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="9">
                <div class="loading">
                  <div class="spinner"></div>
                  <p>Carregando dados...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="prevBtn" class="btn btn-secondary" disabled>Anterior</button>
        <span class="page-info" id="pageInfo">Página 1 de 1</span>
        <button id="nextBtn" class="btn btn-secondary" disabled>Próximo</button>
      </div>
    </div>
  </div>

  <script>
    let currentPage = 1;
    const pageSize = 20;
    let totalRecords = 0;
    let totalPages = 1;
    let allData = [];
    let filteredData = [];

    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('tableBody');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const addBtn = document.getElementById('addBtn');
    const messageBox = document.getElementById('messageBox');
    const userEmail = document.getElementById('userEmail');

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = `message message-${type}`;
      messageBox.classList.remove('hidden');
      setTimeout(() => {
        messageBox.classList.add('hidden');
      }, 5000);
    }

    function loadUserEmail() {
      google.script.run
        .withSuccessHandler(function(email) {
          userEmail.textContent = email;
        })
        .withFailureHandler(function() {
          userEmail.textContent = 'Não disponível';
        })
        .getUserEmail();
    }

    function loadData() {
      tableBody.innerHTML = '<tr><td colspan="9"><div class="loading"><div class="spinner"></div><p>Carregando dados...</p></div></td></tr>';

      google.script.run
        .withSuccessHandler(function(response) {
          allData = response.data;
          totalRecords = response.totalRecords;
          applySearch();
        })
        .withFailureHandler(function(error) {
          showMessage('Erro ao carregar dados: ' + error, 'error');
          tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 2rem; color: #ef4444;">Erro ao carregar dados</td></tr>';
        })
        .lerTodosOsDadosWeb(1, 10000, {});
    }

    function applySearch() {
      const query = searchInput.value.toLowerCase().trim();

      if (!query) {
        filteredData = allData;
      } else {
        filteredData = allData.filter(row => {
          return row.some(cell =>
            cell && cell.toString().toLowerCase().includes(query)
          );
        });
      }

      totalRecords = filteredData.length;
      totalPages = Math.ceil(totalRecords / pageSize) || 1;
      currentPage = 1;
      renderTable();
      updatePagination();
    }

    function renderTable() {
      if (filteredData.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 2rem; color: #94a3b8;">Nenhum registro encontrado</td></tr>';
        return;
      }

      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filteredData.slice(start, end);

      tableBody.innerHTML = '';
      pageData.forEach((row, index) => {
        const actualIndex = start + index + 2;
        const tr = document.createElement('tr');

        const sistema = row[0] || '';
        const numPaej = row[1] || '';
        const interessado = row[2] || '';
        const entrada = row[3] || '';
        const situacao = row[4] || '';
        const assimetria = row[5] || '';
        const ugOrigem = row[7] || '';
        const assunto = row[8] || '';

        let statusClass = 'status-inconforme';
        if (situacao.toLowerCase().includes('conforme') && !situacao.toLowerCase().includes('parcial')) {
          statusClass = 'status-conforme';
        } else if (situacao.toLowerCase().includes('parcial')) {
          statusClass = 'status-parcial';
        }

        tr.innerHTML = `
          <td>${sistema}</td>
          <td>${numPaej}</td>
          <td>${interessado}</td>
          <td>${entrada}</td>
          <td><span class="status-badge ${statusClass}">${situacao}</span></td>
          <td>${assimetria}</td>
          <td>${ugOrigem}</td>
          <td>${assunto}</td>
          <td>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-secondary" style="padding: 0.5rem 0.75rem; font-size: 0.85rem;" onclick="editRecord(${actualIndex}, ${index})">Editar</button>
              <button class="btn btn-danger" style="padding: 0.5rem 0.75rem; font-size: 0.85rem;" onclick="deleteRecord(${actualIndex})">Excluir</button>
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function updatePagination() {
      pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages || totalRecords === 0;
    }

    function editRecord(rowIndex, dataIndex) {
      showMessage('Funcionalidade de edição em desenvolvimento', 'error');
    }

    function deleteRecord(rowIndex) {
      if (!confirm('Tem certeza que deseja excluir este registro?')) {
        return;
      }

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.sucesso) {
            showMessage(response.mensagem, 'success');
            loadData();
          } else {
            showMessage(response.mensagem, 'error');
          }
        })
        .withFailureHandler(function(error) {
          showMessage('Erro ao excluir registro: ' + error, 'error');
        })
        .deletarRegistroWeb(rowIndex);
    }

    searchInput.addEventListener('input', applySearch);

    prevBtn.addEventListener('click', function() {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
        updatePagination();
      }
    });

    nextBtn.addEventListener('click', function() {
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
        updatePagination();
      }
    });

    refreshBtn.addEventListener('click', loadData);

    addBtn.addEventListener('click', function() {
      showMessage('Funcionalidade de adicionar registro em desenvolvimento', 'error');
    });

    document.addEventListener('DOMContentLoaded', function() {
      loadUserEmail();
      loadData();
    });
  </script>
</body>
</html>
